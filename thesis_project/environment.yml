# environment.yml
name: rl-thesis
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch=2.1.0
  - torchvision=0.16.0
  - torchaudio=2.1.0
  - pytorch-cuda=11.8
    # 或者用：pytorch-cuda=12.1（如果你的 GPU 支持）
  - numpy=1.24.3
  - gymnasium=0.29.1
  - stable-baselines3=2.0.0
  - pyyaml=6.0
  - pip
  - pip:
    - -r requirements.txt